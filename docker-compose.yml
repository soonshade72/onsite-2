services:
  server1:
   build:
    context: .
    dockerfile: ./server1/Dockerfile
  server2:
   build:
    context: .
    dockerfile: ./server2/Dockerfile
  server3:
    build:
     context: .
     dockerfile: ./server3/Dockerfile
  server4:
    build:
     context: .
     dockerfile: ./server4/Dockerfile
  loadbalancing:
    image: nginx
    ports:
    - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
    - server1
    - server2
    - server3




